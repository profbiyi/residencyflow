services:
  # ===================
  # CONTROL PLANE
  # ===================
  
  postgres:
    image: postgres:16-alpine
    container_name: residencyflow-db
    environment:
      POSTGRES_DB: residencyflow
      POSTGRES_USER: ${POSTGRES_USER:-residency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-residency}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: residencyflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} PING | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: residencyflow-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-residency}:${POSTGRES_PASSWORD}@postgres:5432/residencyflow
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: residencyflow
      KEYCLOAK_CLIENT_ID: residencyflow-api
      PREFECT_API_URL: http://prefect:4200/api
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped

  # ===================
  # DATA PLANE
  # ===================

  prefect:
    image: prefecthq/prefect:3-python3.11
    container_name: residencyflow-prefect
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    ports:
      - "4200:4200"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health').read(); print('ok')"]
      interval: 5s
      timeout: 3s
      retries: 30

  prefect_init:
    image: prefecthq/prefect:3-python3.11
    container_name: residencyflow-prefect-init
    depends_on:
      prefect:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_WORK_POOL: default-pool
    networks:
      - backend
    volumes:
      - ./backend:/app
    working_dir: /app
    command: python prefect_bootstrap.py
    restart: "no"

  worker:
    image: prefecthq/prefect:3-python3.11
    container_name: residencyflow-worker
    depends_on:
      prefect_init:
        condition: service_completed_successfully
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_WORK_POOL: default-pool
      CONTROL_PLANE_API_URL: http://api:8000
      WORKER_SHARED_KEY: ${WORKER_SHARED_KEY}
    networks:
      - backend
    volumes:
      - ./backend:/app
    working_dir: /app
    command: prefect worker start --pool default-pool
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: residencyflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================
  # IDENTITY & ACCESS
  # ===================

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: residencyflow-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-residency}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped

  # ===================
  # OBSERVABILITY
  # ===================

  prometheus:
    image: prom/prometheus:latest
    container_name: residencyflow-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: residencyflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - backend
      - frontend
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: residencyflow-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml
    networks:
      - backend
    restart: unless-stopped

  # ===================
  # FRONTEND
  # ===================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: residencyflow-frontend
    environment:
      VITE_API_URL: http://${DOMAIN:-localhost}:8000
    ports:
      - "5173:80"
    networks:
      - frontend
    depends_on:
      - api
    restart: unless-stopped

  # ===================
  # REVERSE PROXY
  # ===================

  caddy:
    image: caddy:2-alpine
    container_name: residencyflow-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    restart: unless-stopped
    depends_on:
      - api
      - keycloak
      - grafana

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prefect_data:
    driver: local
  dlt_data:
    driver: local
  pipeline_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
