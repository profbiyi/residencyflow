# Prometheus Alert Rules for ResidencyFlow
# Production-ready alerts for critical issues

groups:
  # ========================================================================
  # API Health & Performance
  # ========================================================================
  - name: api_alerts
    interval: 30s
    rules:
      - alert: APIHighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High API error rate (>5%)"
          description: "API error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

      - alert: APISlowResponse
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API slow response time (p95 > 1s)"
          description: "95th percentile response time is {{ $value }}s"

      - alert: APIDown
        expr: up{job="fastapi"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "FastAPI service is down"
          description: "API has been down for more than 1 minute"

  # ========================================================================
  # Database Health
  # ========================================================================
  - name: database_alerts
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been down for more than 1 minute"

      - alert: PostgreSQLHighConnections
        expr: |
          pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL connection pool near limit (>80%)"
          description: "{{ $value | humanizePercentage }} of max connections used"

      - alert: PostgreSQLSlowQueries
        expr: |
          rate(pg_stat_activity_max_tx_duration[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL has slow queries"
          description: "Slow queries detected for 5+ minutes"

      - alert: PostgreSQLReplicationLag
        expr: |
          pg_replication_lag > 30
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL replication lag > 30s"
          description: "Replication lag is {{ $value }}s"

  # ========================================================================
  # Redis Health
  # ========================================================================
  - name: redis_alerts
    interval: 30s
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"

      - alert: RedisHighMemory
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory usage >90%"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory"

      - alert: RedisHighFragmentation
        expr: redis_mem_fragmentation_ratio > 1.5
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory fragmentation >1.5"
          description: "Fragmentation ratio is {{ $value }}"

  # ========================================================================
  # Storage (MinIO) Health
  # ========================================================================
  - name: storage_alerts
    interval: 60s
    rules:
      - alert: MinIODown
        expr: up{job="minio"} == 0
        for: 1m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "MinIO is down"
          description: "MinIO has been down for more than 1 minute"

      - alert: MinIOHighDiskUsage
        expr: |
          minio_disk_storage_used_bytes / minio_disk_storage_total_bytes > 0.85
        for: 10m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "MinIO disk usage >85%"
          description: "Disk usage is {{ $value | humanizePercentage }}"

      - alert: MinIOHighAPIErrors
        expr: |
          rate(minio_s3_requests_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "MinIO API error rate high"
          description: "{{ $value }} errors per second"

  # ========================================================================
  # Prefect Orchestration Health
  # ========================================================================
  - name: prefect_alerts
    interval: 60s
    rules:
      - alert: PrefectDown
        expr: up{job="prefect"} == 0
        for: 2m
        labels:
          severity: critical
          component: orchestration
        annotations:
          summary: "Prefect server is down"
          description: "Prefect has been down for more than 2 minutes"

      - alert: PrefectHighFailureRate
        expr: |
          rate(prefect_flow_runs_failed_total[10m]) / rate(prefect_flow_runs_total[10m]) > 0.2
        for: 10m
        labels:
          severity: warning
          component: orchestration
        annotations:
          summary: "Prefect flow failure rate >20%"
          description: "{{ $value | humanizePercentage }} of flows are failing"

      - alert: PrefectQueueBacklog
        expr: prefect_work_queue_size > 100
        for: 15m
        labels:
          severity: warning
          component: orchestration
        annotations:
          summary: "Prefect work queue backlog"
          description: "{{ $value }} flows queued for >15 minutes"

  # ========================================================================
  # System Resources
  # ========================================================================
  - name: system_alerts
    interval: 60s
    rules:
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "CPU usage >85%"
          description: "CPU usage is {{ $value | humanize }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Memory usage >90%"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: HighDiskUsage
        expr: |
          (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes > 0.85
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Disk usage >85%"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.mountpoint }}"

      - alert: HighInodeUsage
        expr: |
          (node_filesystem_files - node_filesystem_files_free) / node_filesystem_files > 0.9
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Inode usage >90%"
          description: "Inode usage is {{ $value | humanizePercentage }} on {{ $labels.mountpoint }}"

  # ========================================================================
  # Container Health
  # ========================================================================
  - name: container_alerts
    interval: 30s
    rules:
      - alert: ContainerDown
        expr: |
          time() - container_last_seen{name!~".*POD.*"} > 60
        for: 2m
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container has been down for >2 minutes"

      - alert: ContainerHighMemory
        expr: |
          container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Container {{ $labels.name }} memory >90%"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      - alert: ContainerHighCPU
        expr: |
          rate(container_cpu_usage_seconds_total{name!~".*POD.*"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Container {{ $labels.name }} CPU >80%"
          description: "CPU usage is {{ $value | humanizePercentage }}"

  # ========================================================================
  # Tenant-Specific Alerts
  # ========================================================================
  - name: tenant_alerts
    interval: 60s
    rules:
      - alert: TenantHighAPIUsage
        expr: |
          rate(http_requests_total{tenant_id!=""}[5m]) > 1000
        for: 10m
        labels:
          severity: info
          component: api
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} high API usage"
          description: "{{ $value }} requests per second for 10+ minutes"

      - alert: TenantRateLimitHit
        expr: |
          rate(rate_limit_exceeded_total{tenant_id!=""}[5m]) > 10
        for: 5m
        labels:
          severity: info
          component: api
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} hitting rate limits"
          description: "{{ $value }} rate limit violations per second"

      - alert: TenantPipelineFailures
        expr: |
          rate(pipeline_runs_failed_total{tenant_id!=""}[10m]) > 5
        for: 10m
        labels:
          severity: warning
          component: orchestration
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} pipeline failures"
          description: "{{ $value }} pipeline failures per second"
