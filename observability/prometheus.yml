# Prometheus Configuration for ResidencyFlow
# Collects metrics from: FastAPI, Prefect, PostgreSQL, Redis, MinIO, Keycloak

global:
  scrape_interval: 15s      # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules
  external_labels:
    cluster: 'residencyflow'
    environment: 'production'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # ========================================================================
  # Prometheus itself
  # ========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ========================================================================
  # FastAPI Application Metrics
  # ========================================================================
  - job_name: 'fastapi'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
          component: 'control-plane'
    metrics_path: '/metrics'

  # ========================================================================
  # PostgreSQL Exporter
  # ========================================================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # ========================================================================
  # Redis Exporter
  # ========================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # ========================================================================
  # MinIO Metrics
  # ========================================================================
  - job_name: 'minio'
    scrape_interval: 30s
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'
          component: 'storage'
    metrics_path: '/minio/v2/metrics/cluster'
    scheme: 'http'

  # ========================================================================
  # Prefect Server Metrics
  # ========================================================================
  - job_name: 'prefect'
    scrape_interval: 30s
    static_configs:
      - targets: ['prefect-server:4200']
        labels:
          service: 'prefect'
          component: 'orchestration'

  # ========================================================================
  # Keycloak Metrics
  # ========================================================================
  - job_name: 'keycloak'
    scrape_interval: 30s
    static_configs:
      - targets: ['keycloak:8080']
        labels:
          service: 'keycloak'
          component: 'auth'
    metrics_path: '/metrics'

  # ========================================================================
  # Caddy Metrics
  # ========================================================================
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']
        labels:
          service: 'caddy'
          component: 'proxy'
    metrics_path: '/metrics'

  # ========================================================================
  # Node Exporter (Host Metrics)
  # ========================================================================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'system'

  # ========================================================================
  # cAdvisor (Container Metrics)
  # ========================================================================
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          component: 'containers'
    metrics_path: '/metrics'
