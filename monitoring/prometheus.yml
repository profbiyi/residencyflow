global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'residencyflow-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'residencyflow-api'
    static_configs:
      - targets: ['residencyflow-api:8000']

  - job_name: 'prefect'
    static_configs:
      - targets: ['residencyflow-prefect:4200']

  - job_name: 'postgres'
    static_configs:
      - targets: ['residencyflow-db:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['residencyflow-redis:6379']

  - job_name: 'minio'
    static_configs:
      - targets: ['residencyflow-minio:9000']

  - job_name: 'keycloak'
    static_configs:
      - targets: ['residencyflow-keycloak:8080']
