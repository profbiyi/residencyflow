# ResidencyFlow - dlt Configuration
# This file proves dlt handles EVERYTHING natively

[runtime]
# Polars for performance (dlt's recommended engine)
data_frame_library = "polars"

# Log level (dlt's native logging)
log_level = "INFO"
log_format = "JSON"

[normalize]
# Schema evolution handled by dlt
schema_update_mode = "evolve"  # dlt automatically adds new columns
max_table_nesting = 2          # dlt handles nested JSON

[load]
# Incremental loading (dlt's native feature)
# dlt automatically tracks state in MinIO
workers = 4                     # Parallel loading
raise_on_failed_jobs = true

# Retry logic (native dlt)
retry_attempts = 3
retry_backoff_factor = 2

[extract]
# Extraction handled by dlt sources
# No custom code needed!
workers = 4
max_table_nesting_level = 2

[sources.sql_database]
# dlt's sql_database source configuration
# Incremental is AUTOMATIC via dlt
backend = "pyarrow"             # dlt uses Arrow for speed
chunk_size = 50000              # dlt batching
defer_table_load = false

# dlt's NATIVE incremental cursor tracking
# We don't need to code this!
[sources.sql_database.incremental]
# dlt automatically detects incremental columns
# cursor_path is auto-discovered by dlt
# merge_key is auto-discovered by dlt

[destination.snowflake]
# dlt's Snowflake loader config
# dlt handles staging, COPY INTO, transactions
stage_name = "dlt_stage"
keep_staged_files = false
replace_strategy = "truncate-and-insert"

[destination.bigquery]
# dlt's BigQuery loader
# dlt handles streaming inserts, batch loads
location = "US"
http_timeout = 15.0
file_upload_timeout = 1800.0

[destination.postgres]
# dlt's Postgres loader  
# dlt handles CREATE TABLE, INSERT, UPDATE, MERGE
create_indexes = true
replace_strategy = "insert-from-staging"

[destination.filesystem]
# dlt's filesystem destination (for S3/MinIO)
# dlt writes Parquet with schema evolution
bucket_url = "s3://dlt-output"
layout = "{schema_name}/{table_name}/{load_id}.{file_id}.{ext}"
extra_placeholders = ["load_id", "file_id", "ext"]

# dlt automatically handles:
# - Partitioning
# - Compression
# - Schema files
